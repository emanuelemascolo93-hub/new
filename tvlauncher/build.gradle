plugins {
    id 'com.android.application'
}

android {
    namespace 'it.emmeweb.tvlauncher'
    compileSdk 34

    defaultConfig {
        applicationId "it.emmeweb.tvlauncher"
        minSdk 26
        targetSdk 34
        versionCode 7
        versionName "1.4"
    }

    signingConfigs {
        release {
            storeFile file("../keystore/release.jks")
            storePassword "firetv2026"
            keyAlias "firetviptv"
            keyPassword "firetv2026"
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            signingConfig signingConfigs.release
        }
    }

    packagingOptions {
        resources { excludes += ['META-INF/*.md', 'META-INF/LICENSE*', 'META-INF/NOTICE*', 'META-INF/versions/**', 'META-INF/*.kotlin_module'] }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    implementation platform("org.jetbrains.kotlin:kotlin-bom:1.8.22")
    implementation "androidx.appcompat:appcompat:1.7.0"
    implementation "androidx.recyclerview:recyclerview:1.3.2"
    implementation "org.nanohttpd:nanohttpd:2.3.1"
    implementation "com.google.zxing:core:3.5.3"
    implementation("dev.mobile:dadb:1.2.9") {
        exclude group: "org.junit.platform"
        exclude group: "org.junit.jupiter"
        exclude group: "junit"
    }
}
