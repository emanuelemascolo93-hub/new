plugins {
    id 'com.android.application'
}

android {
    namespace 'it.emmeweb.firetviptv'
    compileSdk 34

    defaultConfig {
        applicationId "it.emmeweb.firetviptv"
        minSdk 22
        targetSdk 34
        versionCode 1
        versionName "1.0"
        ndk {
            // Fire TV Stick 1st gen is 32-bit ARM
            abiFilters 'armeabi-v7a'
        }
    }

    signingConfigs {
        release {
            storeFile file("../keystore/release.jks")
            storePassword "firetv2026"
            keyAlias "firetviptv"
            keyPassword "firetv2026"
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            signingConfig signingConfigs.release
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    packagingOptions {
        resources {
            excludes += ['META-INF/*.md', 'META-INF/LICENSE*', 'META-INF/NOTICE*']
        }
    }
}

dependencies {
    def media3 = "1.4.1"
    implementation "androidx.media3:media3-exoplayer:$media3"
    implementation "androidx.media3:media3-exoplayer-hls:$media3"
    implementation "androidx.media3:media3-ui:$media3"
    implementation "androidx.appcompat:appcompat:1.7.0"
    implementation "androidx.recyclerview:recyclerview:1.3.2"
    implementation "com.wireguard.android:tunnel:1.0.20230706"
}
