name: Build APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: android-actions/setup-android@v3
        with:
          packages: "platforms;android-34 build-tools;34.0.0"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.7"

      - name: Build release APK
        id: build
        continue-on-error: true
        run: gradle assembleRelease --no-daemon --stacktrace 2>&1 | tee build.log; test ${PIPESTATUS[0]} -eq 0

      - name: Publish output to branch "builds"
        run: |
          mkdir -p out
          cp build.log out/build.log
          if [ -f app/build/outputs/apk/release/app-release.apk ]; then
            cp app/build/outputs/apk/release/app-release.apk out/FireTV-IPTV.apk
          fi
          if [ -f warpvpn/build/outputs/apk/release/warpvpn-release.apk ]; then
            cp warpvpn/build/outputs/apk/release/warpvpn-release.apk out/WarpVPN.apk
          fi
          cd out
          git init -q -b builds
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git add -A
          git commit -q -m "Build ${GITHUB_SHA::7} ($(date -u +%Y-%m-%dT%H:%MZ)) result=${{ steps.build.outcome }}"
          git push -f "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${GITHUB_REPOSITORY}.git" builds

      - uses: actions/upload-artifact@v4
        if: steps.build.outcome == 'success'
        with:
          name: APKs
          path: out/*.apk

      - name: Fail if build failed
        if: steps.build.outcome != 'success'
        run: exit 1
